<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a0e1a" />
  <meta name="robots" content="noindex, follow" />
  <meta
    name="description"
    content="Esta página no existe. Volvé al juego de Piedra, Papel o Tijera."
  />
  <title>404 · Fuera de juego</title>
  <link rel="icon" type="image/svg+xml" href="assets/rock-svgrepo-com.svg" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .not-found {
      position: relative;
      z-index: 1;
      width: min(38rem, 100% - 2rem);
      padding: clamp(1.5rem, 5vw, 3rem);
      text-align: center;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: rgba(10, 14, 26, 0.72);
      box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(238, 241, 251, 0.05);
      backdrop-filter: blur(16px);
      animation: rise-in 0.5s ease-out both;
    }

    .not-found__eyebrow {
      margin: 0 0 1rem;
      color: var(--player);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .not-found__code {
      margin: 0;
      font-size: clamp(6rem, 24vw, 10rem);
      font-weight: 950;
      letter-spacing: -0.07em;
      line-height: 0.95;
      background: linear-gradient(135deg, var(--player), #a78bfa 52%, var(--cpu));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 28px rgba(167, 139, 250, 0.2));
    }

    .not-found__title {
      margin: 1.5rem 0 0.65rem;
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 850;
      letter-spacing: -0.02em;
    }

    .not-found__description {
      max-width: 28rem;
      margin: 0 auto;
      color: var(--text-dim);
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      line-height: 1.7;
    }

    .not-found__moves {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(0.75rem, 4vw, 1.5rem);
      margin: 2rem 0;
    }

    .not-found__move {
      width: clamp(3.5rem, 15vw, 4.5rem);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: 0 10px 28px rgba(2, 6, 18, 0.25);
    }

    .not-found__move img {
      width: 62%;
      height: auto;
      filter: drop-shadow(0 5px 10px rgba(2, 6, 18, 0.35));
    }

    .not-found__move:nth-child(1) {
      transform: rotate(-8deg) translateY(3px);
    }

    .not-found__move:nth-child(2) {
      border-color: rgba(167, 139, 250, 0.4);
      transform: translateY(-5px);
    }

    .not-found__move:nth-child(3) {
      transform: rotate(8deg) translateY(3px);
    }

    .not-found__home {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 0.65rem;
      min-height: 3rem;
      padding: 0.85rem 1.4rem;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(92deg, var(--player), #a78bfa);
      color: #0a0e1a;
      font-weight: 850;
      text-decoration: none;
      box-shadow: 0 10px 28px rgba(34, 211, 238, 0.13);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .not-found__home:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 32px rgba(34, 211, 238, 0.24);
    }

    .not-found__home:active {
      transform: translateY(0);
    }

    .not-found__home:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }

    .not-found__home svg {
      width: 1.1rem;
      height: 1.1rem;
    }

    .not-found__footer {
      margin: 1.75rem 0 0;
      color: var(--text-dim);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.75;
    }

    @media (max-width: 26rem) {
      .not-found {
        padding: 1.5rem 1rem;
      }

      .not-found__moves {
        margin: 1.5rem 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .not-found {
        animation: none;
      }

      .not-found__home {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="not-found" aria-labelledby="not-found-title">
    <p class="not-found__eyebrow">Piedra · Papel · Tijera</p>
    <p class="not-found__code" aria-label="Error 404">404</p>
    <h1 class="not-found__title" id="not-found-title">¡Fuera de juego!</h1>
    <p class="not-found__description">
      Esta página no existe o se perdió en la partida.
      Volvé a la arena y seguí jugando.
    </p>

    <div class="not-found__moves" aria-hidden="true">
      <span class="not-found__move">
        <img src="/assets/rock-svgrepo-com.svg" alt="" width="64" height="64" />
      </span>
      <span class="not-found__move">
        <img src="/assets/paper-svgrepo-com.svg" alt="" width="64" height="64" />
      </span>
      <span class="not-found__move">
        <img src="/assets/scissors-part-2-svgrepo-com.svg" alt="" width="64" height="64" />
      </span>
    </div>

    <a class="not-found__home" href="/" aria-label="Volver al inicio del juego">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m3 10 9-7 9 7"></path>
        <path d="M5 9v11h14V9"></path>
        <path d="M9 20v-6h6v6"></path>
      </svg>
      Volver al juego
    </a>

    <p class="not-found__footer">La próxima ronda te espera</p>
  </main>
</body>
</html>
